name: Ejecutar Tarea

on:
  schedule:
    - cron: '0 6 * * *'   # Automático: diario 06:00 UTC (00:00 hora Guatemala)
  workflow_dispatch:      # Activa el botón "Run workflow" manual
    inputs:
      dry_run:
        description: 'Simular sin eliminar ni modificar datos (DRY_RUN)'
        type: boolean
        default: false
      max_lookups:
        description: 'Máximo de llamadas a APIs externas (AniList/Kitsu/TVMaze/IMDb/TMDB)'
        type: string
        default: '400'
      steps_filter:
        description: 'Ejecutar solo estos pasos (ej: 1,2,3). Vacío = los 6'
        type: string
        default: ''

jobs:
  run-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Reemplaza o adapta este paso según lo que ejecute tu workflow
      - name: Ejecutar script principal
        run: |
          echo "Ejecutando script..."
          # Ejemplo de cómo usar los inputs:
          # python script.py --dry-run ${{ inputs.dry_run }}
